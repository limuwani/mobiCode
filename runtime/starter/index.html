<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Built on mobiCode</title><style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#10151d;color:#ebf0f7;font:18px system-ui}
main{max-width:600px;padding:32px}small{color:#38d8be}h1{font-size:clamp(40px,9vw,80px);line-height:1.05;letter-spacing:-.05em}p{color:#99a8bb;line-height:1.6}
button{border:0;border-radius:10px;background:#38d8be;color:#10151d;padding:14px 22px;font:inherit;cursor:pointer}
</style></head><body><main><small>BUILT ON A TABLET</small><h1>Small screen.<br>Big possibilities.</h1><p>Edit this file in mobiCode, save it and refresh your browser.</p><button id="hello">Say hello</button><p id="message" role="status"></p></main>
<script>document.getElementById('hello').onclick=()=>{document.getElementById('message').textContent='Hello from mobiCode!';};</script></body></html>
