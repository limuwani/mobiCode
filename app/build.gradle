plugins { id 'com.android.application' }

android {
    namespace 'dev.mobicode.app'
    compileSdk {
        version = release(37) { minorApiLevel = 2 }
    }
    defaultConfig {
        applicationId 'dev.mobicode.app'
        minSdk 26
        targetSdk 35
        versionCode providers.gradleProperty('ciVersionCode').getOrElse('1').toInteger()
        versionName providers.gradleProperty('ciVersionName').getOrElse('0.2.0-alpha.1')
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release { minifyEnabled false }
    }
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'x86_64'
            universalApk false
        }
    }
    packaging {
        jniLibs {
            useLegacyPackaging = true
            keepDebugSymbols += ['**/*.so']
        }
    }
    lint { abortOnError true }
}

dependencies {
    implementation 'org.apache.commons:commons-compress:1.28.0'
    implementation 'org.mozilla.geckoview:geckoview:160.0.20261116130455'
}
