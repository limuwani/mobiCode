name: Android app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-37.2' 'build-tools;36.0.0'
      - name: Package engine and agent
        run: |
          python3 tools/native_runtime.py
          python3 tools/package.py
          python3 tools/verify.py
          node --test agent/test/*.test.js
          g++ -std=c++17 runtime/starter/main.cpp -o /tmp/mobicode-sample
          /tmp/mobicode-sample
          javac -d /tmp runtime/starter/Hello.java
          java -cp /tmp Hello
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and lint Android app
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug :app:lintDebug \
            -PciVersionCode="${GITHUB_RUN_NUMBER}" \
            -PciVersionName="0.2.0-alpha.${GITHUB_RUN_NUMBER}"
          cp app/build/outputs/apk/debug/app-arm64-v8a-debug.apk dist/mobiCode.apk
          cp app/build/outputs/apk/debug/app-x86_64-debug.apk dist/mobiCode-x86_64.apk
          python3 tools/verify.py dist/mobiCode.apk
          python3 tools/verify.py dist/mobiCode-x86_64.apk
          cd dist
          sha256sum mobiCode.apk mobiCode-x86_64.apk mobiCode-agent.vsix mobiCode-native-sources.zip > SHA256SUMS
      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test first launch on Android 12
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disk-size: 6G
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 -u tools/emulator_smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: mobiCode-alpha-${{ github.run_number }}
          path: dist/

  publish:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mobiCode-alpha-${{ github.run_number }}
          path: dist
      - name: Publish downloadable alpha
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "v0.2.0-alpha.${GITHUB_RUN_NUMBER}" \
            --target "$GITHUB_SHA" --prerelease \
            --title "mobiCode 0.2.0 · alpha ${GITHUB_RUN_NUMBER}" \
            --notes-file docs/ALPHA_RELEASE.md \
            dist/mobiCode.apk dist/mobiCode-x86_64.apk dist/mobiCode-agent.vsix dist/mobiCode-native-sources.zip dist/SHA256SUMS
