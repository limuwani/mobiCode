name: Android app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Package engine and agent
        run: |
          python3 tools/package.py
          python3 tools/verify.py
          node --test agent/test/*.test.js
          bash -n runtime/install-template.sh
          bash -n runtime/start.sh
          g++ -std=c++17 runtime/starter/main.cpp -o /tmp/mobicode-sample
          /tmp/mobicode-sample
          javac -d /tmp runtime/starter/Hello.java
          java -cp /tmp Hello
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and lint Android app
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug :app:lintDebug \
            -PciVersionCode="${GITHUB_RUN_NUMBER}" \
            -PciVersionName="0.1.0-alpha.${GITHUB_RUN_NUMBER}"
          cp app/build/outputs/apk/debug/app-debug.apk dist/mobiCode.apk
          cd dist
          sha256sum mobiCode.apk mobiCode-setup.sh mobiCode-agent.vsix > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: mobiCode-alpha-${{ github.run_number }}
          path: |
            dist/mobiCode.apk
            dist/mobiCode-setup.sh
            dist/mobiCode-agent.vsix
            dist/SHA256SUMS
            app/build/reports/lint-results-debug.html
      - name: Publish downloadable alpha
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "v0.1.0-alpha.${GITHUB_RUN_NUMBER}" \
            --target "$GITHUB_SHA" --prerelease \
            --title "mobiCode 0.1.0 · alpha ${GITHUB_RUN_NUMBER}" \
            --notes-file docs/ALPHA_RELEASE.md \
            dist/mobiCode.apk dist/mobiCode-setup.sh dist/mobiCode-agent.vsix dist/SHA256SUMS
